[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doomsday-cqa-eval"
version = "0.1.0"
description = "Configurable CQA dialogue evaluator"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
cqa-eval = "cqa_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cqa_eval = ["resources/*.json", "resources/*.txt"]
